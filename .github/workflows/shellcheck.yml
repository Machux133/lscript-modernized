name: ShellCheck

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        # Follow source directives so libraries are checked in caller context.
        run: shellcheck -x -S warning l ./*-menu deauth-autocheck install.sh uninstall.sh mitm-helpers/*.sh tests/*.sh

  fedora-maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        fedora: ['44', '45']
    container: registry.fedoraproject.org/fedora:${{ matrix.fedora }}
    steps:
      - uses: actions/checkout@v4

      - name: Check Bash syntax
        shell: bash
        run: |
          for script in l install.sh uninstall.sh ./*-menu deauth-autocheck lib/*.sh mitm-helpers/*.sh tests/*.sh; do
            bash -n "$script"
          done

      - name: Test maintenance commands offline
        shell: bash
        run: bash tests/maintenance.sh
